[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/recursos"
  to = "/#recursos"
  status = 301
  force = true

[[redirects]]
  from = "/recursos/"
  to = "/#recursos"
  status = 301
  force = true

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
